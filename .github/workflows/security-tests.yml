name: ULTRA security tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  worker-security-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Run Worker security and behavior tests
        working-directory: worker
        run: npm test
      - name: Validate fresh schema, upgrade migrations and moderation rollback with SQLite
        working-directory: worker
        run: python3 tests/schema_migrations.test.py
