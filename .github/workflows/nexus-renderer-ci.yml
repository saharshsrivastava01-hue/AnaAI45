name: NEXUS Renderer CI

on:
  push:
    branches: [nexus-virtual-cinema-chip]
  pull_request:
    branches: [nexus-virtual-cinema-chip]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  renderer-tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Compile renderer modules
        working-directory: nexus-virtual-cinema-chip
        run: |
          python -m py_compile nexus_ultra_renderer.py nexus_scene_graph.py nexus_vfx_studio.py nexus_immersive_media.py
      - name: Run regression tests
        working-directory: nexus-virtual-cinema-chip
        run: python -m unittest discover -s tests -v

  dummy-film-preview:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Render NEXUS 2090 dummy film frames
        working-directory: nexus-virtual-cinema-chip
        run: |
          python nexus_ultra_renderer.py --out dummy-film-output --width 96 --height 54 --frames 8 --fps 12 --spp 1 --depth 1
      - name: Encode MP4 preview when FFmpeg is available
        working-directory: nexus-virtual-cinema-chip
        run: |
          if command -v ffmpeg >/dev/null 2>&1; then
            ffmpeg -y -framerate 12 -i dummy-film-output/frame_%05d.ppm -c:v libx264 -pix_fmt yuv420p dummy-film-output/NEXUS_2090_DUMMY_FILM.mp4
          else
            echo "FFmpeg unavailable; retaining rendered PPM frames as the preview artifact."
          fi
      - name: Upload dummy-film preview artifact
        uses: actions/upload-artifact@v4
        with:
          name: nexus-2090-dummy-film-preview
          path: nexus-virtual-cinema-chip/dummy-film-output/
          if-no-files-found: error
          retention-days: 7
