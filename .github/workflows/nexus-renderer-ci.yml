name: NEXUS Renderer CI

on:
  push:
    branches: [nexus-virtual-cinema-chip]
  pull_request:
    branches: [nexus-virtual-cinema-chip]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  renderer-tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Compile renderer modules
        working-directory: nexus-virtual-cinema-chip
        run: |
          python -m py_compile nexus_ultra_renderer.py nexus_scene_graph.py nexus_vfx_studio.py nexus_immersive_media.py
      - name: Run regression tests
        working-directory: nexus-virtual-cinema-chip
        run: python -m unittest discover -s tests -v
