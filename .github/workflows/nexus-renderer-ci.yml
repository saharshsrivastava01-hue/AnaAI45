name: NEXUS Renderer and Hardware CI

on:
  push:
    branches: [nexus-virtual-cinema-chip]
  pull_request:
    branches: [nexus-virtual-cinema-chip]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  software-fabric:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Compile software fabric and media modules
        working-directory: nexus-virtual-cinema-chip
        run: |
          python -m py_compile nexus3000_virtual_chip.py nexus_horizon_runtime.py nexus_horizon_scheduler.py nexus3000_film_fabric.py nexus_cinematic_vfx_audio.py nexus_ultra_renderer.py nexus_film_pipeline.py nexus_scene_graph.py nexus_vfx_studio.py nexus_immersive_media.py
          python nexus3000_virtual_chip.py --plan
          python nexus3000_virtual_chip.py --topology
      - name: Smoke-test complete film-to-MP4 pipeline
        working-directory: nexus-virtual-cinema-chip
        run: python nexus_film_pipeline.py --out /tmp/nexus-film-smoke --width 16 --height 16 --frames 2 --fps 2 --spp 1 --depth 0
      - name: Run renderer regression tests
        working-directory: nexus-virtual-cinema-chip
        run: python -m unittest discover -s tests -v

  hardware-rtl:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Icarus Verilog
        run: |
          sudo apt-get update
          sudo apt-get install -y iverilog
      - name: Simulate NEXUS compute tile
        working-directory: nexus-virtual-cinema-chip/hardware
        run: |
          iverilog -g2012 -s tb_nexus3000_compute_tile -o /tmp/nexus_tb rtl/nexus3000_compute_tile.sv tb/tb_nexus3000_compute_tile.sv
          vvp /tmp/nexus_tb
      - name: Compile additional RTL modules
        working-directory: nexus-virtual-cinema-chip/hardware
        run: |
          iverilog -g2012 -tnull rtl/nexus3000_scratchpad.sv
          iverilog -g2012 -tnull rtl/nexus3000_tensor_dot.sv
          iverilog -g2012 -tnull rtl/nexus3000_command_unit.sv
      - name: Simulate integrated NEXUS chip top
        working-directory: nexus-virtual-cinema-chip/hardware
        run: |
          iverilog -g2012 -s tb_nexus3000_chip_top -o /tmp/nexus_top_tb rtl/nexus3000_compute_tile.sv rtl/nexus3000_command_unit.sv rtl/nexus3000_chip_top.sv tb/tb_nexus3000_chip_top.sv
          vvp /tmp/nexus_top_tb
      - name: Simulate NEXUS ray AABB accelerator
        working-directory: nexus-virtual-cinema-chip/hardware
        run: |
          iverilog -g2012 -s tb_nexus3000_ray_aabb -o /tmp/nexus_ray_tb rtl/nexus3000_ray_aabb.sv tb/tb_nexus3000_ray_aabb.sv
          vvp /tmp/nexus_ray_tb
      - name: Simulate NEXUS BVH traversal
        working-directory: nexus-virtual-cinema-chip/hardware
        run: |
          iverilog -g2012 -s tb_nexus3000_bvh_traversal -o /tmp/nexus_bvh_tb rtl/nexus3000_bvh_traversal.sv tb/tb_nexus3000_bvh_traversal.sv
          vvp /tmp/nexus_bvh_tb
      - name: Simulate NEXUS triangle intersection
        working-directory: nexus-virtual-cinema-chip/hardware
        run: |
          iverilog -g2012 -s tb_nexus3000_triangle_intersect -o /tmp/nexus_tri_tb rtl/nexus3000_triangle_intersect.sv tb/tb_nexus3000_triangle_intersect.sv
          vvp /tmp/nexus_tri_tb

  full-dummy-film:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install FFmpeg
        run: |
          if ! command -v ffmpeg >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y ffmpeg
          fi
          ffmpeg -version | head -n 1
      - name: Render procedural NEXUS source frames
        working-directory: nexus-virtual-cinema-chip
        run: |
          python nexus_ultra_renderer.py --out dummy-film-output --width 96 --height 54 --frames 120 --fps 12 --spp 1 --depth 1
      - name: Encode MP4
        working-directory: nexus-virtual-cinema-chip
        run: |
          ffmpeg -y -framerate 12 -i dummy-film-output/frame_%05d.ppm -c:v libx264 -preset veryfast -crf 24 -pix_fmt yuv420p dummy-film-output/NEXUS_2090_DUMMY_FILM.mp4
          ffprobe -v error -show_entries format=duration,size -of default=noprint_wrappers=1 dummy-film-output/NEXUS_2090_DUMMY_FILM.mp4
      - uses: actions/upload-artifact@v4
        with:
          name: nexus-2090-full-dummy-film
          path: nexus-virtual-cinema-chip/dummy-film-output/
          if-no-files-found: error
          retention-days: 7
